<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Trainly - Passenger Details</title>

    <link
            rel="stylesheet"
            href="css/style.css">

</head>


<body>


<!-- =========================================
     NAVBAR
========================================= -->

<header class="navbar">

    <div class="logo">

        <span class="logo-icon">
            🚆
        </span>

        <span>
            Trainly
        </span>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="search-results.html">
            Search
        </a>

    </nav>


    <div class="nav-buttons">

        <a
                href="login.html"
                class="login-btn">

            Login

        </a>

        <a
                href="register.html"
                class="register-btn">

            Register

        </a>

    </div>

</header>


<!-- =========================================
     MAIN
========================================= -->

<main class="passenger-page">


    <!-- =====================================
         PAGE HEADER
    ====================================== -->

    <div class="passenger-header">

        <div>

            <span class="hero-tag">
                PASSENGER DETAILS
            </span>

            <h1>
                Who's Travelling?
            </h1>

            <p id="journeyInfo">
                Enter details for each passenger.
            </p>

        </div>


        <a
                href="seats.html"
                class="back-btn">

            ← Change Seats

        </a>

    </div>


    <!-- =====================================
         PASSENGERS
    ====================================== -->

    <div
            id="passengerContainer"
            class="passenger-container">

    </div>


    <!-- =====================================
         ERROR
    ====================================== -->

    <div
            id="passengerError"
            class="error-message">

    </div>


    <!-- =====================================
         BOTTOM BAR
    ====================================== -->

    <div class="passenger-bottom">

        <div>

            <span>
                Passengers
            </span>

            <strong id="passengerCount">
                0
            </strong>

        </div>


        <button
                id="continueBtn"
                class="continue-btn"
                type="button">

            Continue to Summary →

        </button>

    </div>

</main>


<!-- =========================================
     FOOTER
========================================= -->

<footer>

    <div class="footer-content">

        <div class="logo">
            🚆 Trainly
        </div>

        <p>
            Your simple and reliable train booking system.
        </p>

    </div>


    <div class="footer-bottom">

        © 2026 Trainly. All rights reserved.

    </div>

</footer>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="js/app.js"></script>
<script src="js/passengers.js"></script>


</body>

</html>
