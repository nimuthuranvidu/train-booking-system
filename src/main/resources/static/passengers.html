
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trainly - Passenger Details</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        <span class="logo-icon">🚆</span>
        <span>Trainly</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="search-results.html">Search</a>
    </nav>

    <div class="nav-buttons">
        <a href="#" class="login-btn">Login</a>
        <a href="#" class="register-btn">Register</a>
    </div>

</header>


<main class="passenger-page">

    <div class="passenger-header">

        <div>

            <span class="hero-tag">
                PASSENGER DETAILS
            </span>

            <h1>Who's Travelling?</h1>

            <p id="journeyInfo">
                Enter details for each passenger.
            </p>

        </div>

        <a
                href="seats.html"
                class="back-btn">

            ← Change Seats

        </a>

    </div>


    <div
            id="passengerContainer"
            class="passenger-container">

    </div>


    <div
            id="passengerError"
            class="error-message">

    </div>


    <div class="passenger-bottom">

        <div>

            <span>Passengers</span>

            <strong id="passengerCount">
                0
            </strong>

        </div>

        <button
                id="continueBtn"
                class="continue-btn">

            Continue to Summary →

        </button>

    </div>

</main>


<footer>

    <div class="footer-content">

        <div class="logo">
            🚆 Trainly
        </div>

        <p>
            Your simple and reliable train booking system.
        </p>

    </div>

    <div class="footer-bottom">
        © 2026 Trainly. All rights reserved.
    </div>

</footer>


<script src="js/passengers.js"></script>

</body>
</html>
