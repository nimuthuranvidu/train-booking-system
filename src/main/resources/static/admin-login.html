
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainly - Admin Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">
        <span class="logo-icon">🚆</span>
        <span>Trainly Admin</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
    </nav>

    <div class="nav-buttons">
        <a href="login.html" class="login-btn">Customer Login</a>
    </div>
</header>

<main class="auth-page">
    <div class="auth-card">

        <div class="auth-header">
            <span class="hero-tag">ADMINISTRATION</span>
            <h1>Admin Login</h1>
            <p>Sign in to manage the Trainly booking system.</p>
        </div>

        <form id="adminLoginForm">

            <div class="form-group">
                <label for="email">Admin Email</label>
                <input
                        type="email"
                        id="email"
                        placeholder="Enter admin email"
                        autocomplete="username"
                        required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                >
            </div>

            <div id="adminLoginError" class="error-message"></div>

            <button
                    type="submit"
                    id="adminLoginBtn"
                    class="auth-submit-btn"
            >
                Login as Admin
            </button>

        </form>

        <div class="auth-footer">
            <p><a href="index.html">Back to Home</a></p>
        </div>

    </div>
</main>

<footer>
    <div class="footer-content">
        <div class="logo">🚆 Trainly</div>
        <p>Your simple and reliable train booking system.</p>
    </div>

    <div class="footer-bottom">
        © 2026 Trainly. All rights reserved.
    </div>
</footer>

<script src="js/admin-login.js"></script>

</body>
</html>
