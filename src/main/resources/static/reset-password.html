<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trainly - Reset Password</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        <span class="logo-icon">🚆</span>
        <span>Trainly</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html">About</a>
        <a href="index.html">Contact</a>
    </nav>

    <div class="nav-buttons">

        <a href="login.html" class="login-btn">
            Login
        </a>

        <a href="register.html" class="register-btn">
            Register
        </a>

    </div>

</header>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            🔐
        </div>

        <span class="hero-tag">
            RESET PASSWORD
        </span>

        <h1>
            Create New Password
        </h1>

        <p class="auth-description">
            Enter the OTP sent to your email and create
            a new password for your Trainly account.
        </p>


        <form id="resetPasswordForm">


            <!-- EMAIL -->

            <div class="auth-field">

                <label for="email">
                    Email Address
                </label>

                <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

            </div>


            <!-- OTP -->

            <div class="auth-field">

                <label for="otp">
                    OTP
                </label>

                <input
                        type="text"
                        id="otp"
                        placeholder="Enter 6-digit OTP"
                        maxlength="6"
                        required>

            </div>


            <!-- NEW PASSWORD -->

            <div class="auth-field">

                <label for="newPassword">
                    New Password
                </label>

                <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        required>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="auth-field">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        required>

            </div>


            <!-- ERROR -->

            <div
                    id="resetPasswordError"
                    class="auth-error">
            </div>


            <!-- SUCCESS -->

            <div
                    id="resetPasswordSuccess"
                    class="auth-success">
            </div>


            <!-- BUTTON -->

            <button
                    type="submit"
                    id="resetPasswordBtn"
                    class="auth-submit">

                Reset Password

            </button>

        </form>


        <div class="auth-footer">

            Remember your password?

            <a href="login.html">
                Back to Login
            </a>

        </div>

    </div>

</main>


<footer>

    <div class="footer-bottom">
        © 2026 Trainly. All rights reserved.
    </div>

</footer>


<script src="js/reset-password.js"></script>

</body>

</html>
