<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trainly - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        <span class="logo-icon">🚆</span>
        <span>Trainly</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="nav-buttons">

        <a href="login.html" class="login-btn">
            Login
        </a>

        <a href="register.html" class="register-btn">
            Register
        </a>

    </div>

</header>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            🚆
        </div>

        <span class="hero-tag">
            WELCOME BACK
        </span>

        <h1>
            Login to Trainly
        </h1>

        <p class="auth-description">
            Sign in to manage your train bookings.
        </p>

        <form id="loginForm">

            <div class="auth-field">

                <label for="email">
                    Email Address
                </label>

                <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

            </div>

            <div class="auth-field">

                <label for="password">
                    Password
                </label>

                <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

            </div>

            <div class="forgot-password">

                <a href="forgot-password.html">
                    Forgot Password?
                </a>

            </div>

            <div
                    id="loginError"
                    class="auth-error">
            </div>

            <button
                    type="submit"
                    id="loginButton"
                    class="auth-submit">

                Login

            </button>

        </form>

        <div class="auth-footer">

            Don't have an account?

            <a href="register.html">
                Create an account
            </a>

        </div>

    </div>

</main>


<footer>

    <div class="footer-bottom">
        © 2026 Trainly. All rights reserved.
    </div>

</footer>


<script src="js/login.js"></script>

</body>

</html>
