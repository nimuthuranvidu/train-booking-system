<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Trainly - Verify OTP</title>

    <link
            rel="stylesheet"
            href="css/style.css"
    >

</head>


<body>


<header class="navbar">

    <div class="logo">

        <span class="logo-icon">🚆</span>

        <span>Trainly</span>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="search-results.html">
            Search
        </a>

    </nav>


    <div class="nav-buttons">

        <a
                href="login.html"
                class="login-btn"
        >
            Login
        </a>

    </div>

</header>



<main class="auth-page">


    <div class="auth-card">


        <div class="auth-header">

            <span class="hero-tag">
                EMAIL VERIFICATION
            </span>


            <h1>
                Verify Your Account
            </h1>


            <p>
                Enter the 6-digit OTP sent to your email address.
            </p>


            <p
                    id="otpEmail"
                    class="otp-email"
            >
            </p>

        </div>



        <form id="otpForm">


            <div class="form-group">

                <label for="otp">
                    Verification Code
                </label>


                <input
                        type="text"
                        id="otp"
                        maxlength="6"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        placeholder="Enter 6-digit OTP"
                        required
                >

            </div>



            <div
                    id="otpError"
                    class="error-message"
            >
            </div>



            <div
                    id="otpSuccess"
                    class="success-message"
            >
            </div>



            <button
                    type="submit"
                    id="verifyBtn"
                    class="auth-submit-btn"
            >
                Verify OTP
            </button>


        </form>



        <div class="auth-footer">

            <p>
                Already have an account?
                <a href="login.html">
                    Login
                </a>
            </p>

        </div>


    </div>


</main>



<footer>

    <div class="footer-content">

        <div class="logo">
            🚆 Trainly
        </div>

        <p>
            Your simple and reliable train booking system.
        </p>

    </div>


    <div class="footer-bottom">

        © 2026 Trainly. All rights reserved.

    </div>

</footer>



<script src="js/verify-otp.js"></script>


</body>

</html>
